global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'silverithm'
    scrape_interval: 2s
    metrics_path: /metrics
    static_configs:
      # 블루그린: 활성 색만 살아있으므로 유휴 색 타깃은 down 상태가 정상
      - targets: ['silverithm-backend-blue:9101', 'silverithm-backend-green:9101']