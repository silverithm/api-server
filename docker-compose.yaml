version: '3.8'

# 컨테이너 로그 상한 (전 서비스 공통)
#
# /etc/docker/daemon.json에도 같은 값을 걸어뒀지만 그 설정은 "컨테이너를 새로 만들 때"만
# 적용된다. 그래서 오래 살아 있는 컨테이너(loki·nginx는 반년 넘게 재생성되지 않았다)는
# 로테이션을 못 받고 로그를 무한히 쌓았다 — 2026-08 점검에서 loki 한 컨테이너가 3.4GB였다.
# compose에 명시해두면 서비스가 재생성될 때마다 확실히 걸린다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# 블루그린 공통 설정 (app-blue/app-green이 공유)
x-app-common: &app-common
  build: .
  logging: *default-logging
  volumes:
    - ./logs:/logs
  deploy:
    resources:
      limits:
        cpus: '2.0'
  env_file:
    - .env
  depends_on:
    - db
  # 유휴 색은 docker stop 상태를 유지해야 하므로 always가 아닌 unless-stopped
  restart: unless-stopped
  networks:
    - silverithm_network

x-app-env: &app-env
  LOG_PATH: /logs
  SPRING_DATASOURCE_URL: ${MYSQL_PROD_URL}
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
  SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
  SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  SPRING_MAIL_HOST: ${MAIL_HOST}
  SPRING_MAIL_PORT: 587
  SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
  SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  SLACK_MONITORING_WEBHOOK_URL: ${SLACK_MONITORING_WEBHOOK_URL}
  SLACK_PAYMENT_WEBHOOK_URL: ${SLACK_PAYMENT_WEBHOOK_URL}
  SLACK_SIGNUP_WEBHOOK_URL: ${SLACK_SIGNUP_WEBHOOK_URL}
  SLACK_API_FAILURE_WEBHOOK_URL: ${SLACK_API_FAILURE_WEBHOOK_URL}
  JAVA_OPTS: >
    -XX:MaxRAMPercentage=80.0
    -XX:InitialRAMPercentage=70.0
    -XX:+UseG1GC
    -XX:ParallelGCThreads=10  # 10코어에 맞춤
    -XX:ConcGCThreads=2
    -XX:MaxGCPauseMillis=200

services:
  loki:
    image: grafana/loki:2.9.2
    logging: *default-logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - silverithm_network

  promtail:
    image: grafana/promtail:2.9.2
    logging: *default-logging
    volumes:
      - ./logs:/logs
      - ./cfg/promtail.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - silverithm_network

  prometheus:
    image: prom/prometheus
    logging: *default-logging
    container_name: prometheus
    volumes:
      - ./cfg/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - silverithm_network
  grafana:
    image: grafana/grafana
    logging: *default-logging
    container_name: grafana
    restart: always
    ports:
      - 3003:3003
    volumes:
      - ./cfg/grafana/provisioning:/etc/grafana/provisioning
      - ./cfg/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana-data:/var/lib/grafana
    env_file:
      - .env
      - ./cfg/grafana/grafana.env
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_MONITORING_WEBHOOK_URL=${SLACK_MONITORING_WEBHOOK_URL}
    networks:
      - silverithm_network
  zipkin:
    image: openzipkin/zipkin
    logging: *default-logging
    container_name: zipkin
    ports:
      - "9411:9411" # Expose the Zipkin UI port
    networks:
      - silverithm_network
  db:
    container_name: silverithm_db
    image: mysql:8.3
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    restart: always
    networks:
      - silverithm_network
    command: [ 'mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--slow-query-log=1', '--slow-query-log-file=/var/log/mysql/mysql-slow.log', '--long-query-time=1' ]

  redis:
    container_name: silverithm_redis
    image: redis
    logging: *default-logging
    ports:
      - "6379:6379"
    restart: always
    networks:
      - silverithm_network

  # 블루그린 무중단 배포: app-blue/app-green 중 한쪽만 활성.
  # 배포는 ./deploy.sh 사용 (유휴 색 빌드·기동 → 헬스체크 → nginx upstream 전환 → 구버전 중지).
  # 주의: 전체 스택 `docker-compose up -d`는 두 색을 모두 띄우므로 앱은 deploy.sh로만 관리할 것.
  app-blue:
    <<: *app-common
    container_name: silverithm-backend-blue
    ports:
      - "8081:8080"   # 호스트 헬스체크용 (nginx는 컨테이너 네트워크로 프록시)
    environment:
      <<: *app-env
      DEPLOY_COLOR: blue

  app-green:
    <<: *app-common
    container_name: silverithm-backend-green
    ports:
      - "8082:8080"   # 호스트 헬스체크용
    environment:
      <<: *app-env
      DEPLOY_COLOR: green

  nginx:
    image: nginx:latest
    logging: *default-logging
    restart: unless-stopped
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # 블루그린: 앱 의존 제거 (upstream.conf가 활성 색만 참조하므로 nginx는 독립 기동)
    networks:
      - silverithm_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    restart: unless-stopped
    logging: *default-logging
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --cert-name silverithm.site; sleep 12h & wait $${!}; done;'"
    networks:
      - silverithm_network

volumes:
  db-data:
  grafana-data:

networks:
  silverithm_network: